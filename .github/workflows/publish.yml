name: Publish to npm

# Tokenless, OTP-less publishing via npm Trusted Publishing (OIDC).
# Configure the trusted publisher on npmjs.com for @cp7553479/image-cli:
#   Repository = image-cli, Workflow filename = publish.yml,
#   Environment name = (leave blank).
# Then push a tag like v0.1.3 to release.
# Note: trusted publishing requires npm >= 11.5.1 AND Node >= 22.14.0,
# so this workflow runs on Node 24 with npm@11 (the npm bundled with
# Node 20 is too old and the publish PUT is rejected with E404).

on:
  push:
    tags:
      - "v*"

# id-token:write is required for npm to mint an OIDC token and verify this run.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, verify & publish
    runs-on: ubuntu-latest
    # No `environment:` here — keep it in sync with the trusted publisher
    # config on npm (Environment name left blank). Matching is simpler and
    # avoids E404 from a missing-environment mismatch on tag pushes.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node >= 22.14.0 (npm docs).
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, lint, test, build)
        run: npm run verify

      - name: Upgrade npm for trusted publishing
        # Trusted publishing needs npm >= 11.5.1; without it the publish PUT
        # is rejected with E404. Pin to npm@11: npm@12 engines shift fast.
        run: npm install -g npm@11

      - name: Publish
        # TEMP: verbose http logging to diagnose OIDC exchange (E404 on PUT).
        run: npm publish --access public --provenance --loglevel=http
        # No token needed — npm authenticates this run via OIDC.
        # Intentionally NOT setting NODE_AUTH_TOKEN, which would override OIDC.
